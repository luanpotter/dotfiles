# My Custom Keybindings

# ctrl+t and ctrl+w
bind -n C-t new-window -c "#{pane_current_path}"
bind -n C-w kill-window

# rebind ctrl+c
unbind-key -n C-c
bind-key  -n C-c send-keys C-c

# Options to make tmux more pleasant

set -g renumber-windows on # automatically re-index tabs
set -g mouse on
set -g default-terminal "tmux-256color"

# pass modified keys (e.g. shift+enter) through to apps that ask for them
set -g extended-keys on
set -as terminal-features 'xterm-ghostty:extkeys'

# Menus config

set -g @menus_trigger 'Space'

# Status bar, colors from config/quickshell/colors.json

set-option -g status-position bottom
set -g status-style "bg=#0c0d10,fg=#80858f"
set -g status-left ""
set -g status-right ""

# numbered from 1 to match the ctrl+1-9 / cmd+1-9 keys (windows start at 0)
set -g window-status-separator ""
set -g window-status-format " #{e|+:#I,1} #W "
set -g window-status-current-format " #{e|+:#I,1} #W "
set -g window-status-current-style "bg=#111216,fg=#33ccff"

set -g pane-border-style "fg=#252628"
set -g pane-active-border-style "fg=#33ccff"
set -g message-style "bg=#111216,fg=#c9ccd3"
set -g mode-style "bg=#33ccff,fg=#0c0d10"

# vim-like pane resizing

bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# vim-like pane switching

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# and now unbind keys

unbind Up
unbind Down
unbind Left
unbind Right
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# List of plugins (installed by the tmux module's exec, see os/commons/terminal.yaml)

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jaclu/tmux-menus'

# Keep plugins in ~/.tmux/plugins: with tmux.conf in ~/.config/tmux, tpm
# would otherwise install them there, which links into the dotfiles repo
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)

run '~/.tmux/plugins/tpm/tpm'

