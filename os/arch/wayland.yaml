modules:
  - name: hyprland
    default: false
    install:
      - pacman:wayland
      - pacman:wayland-protocols
      - pacman:libinput
      - pacman:polkit
      - pacman:xdg-desktop-portal
      - pacman:xdg-desktop-portal-wlr
      - pacman:xorg-xwayland
      - pacman:hyprland
      - pacman:xdg-utils
      - pacman:wl-clipboard
      - pacman:qt6-wayland
      - pacman:qt5-wayland
      - pacman:hyprpaper
      - pacman:xdg-desktop-portal-gtk
      - pacman:xdg-desktop-portal-hyprland
      # screenshot: hyprshot -> satty + hyprpicker
      - pacman:hyprshot
      - pacman:satty
      - pacman:hyprpicker
    config: ~/.config/hypr

  # session env ($PATH, etc); uwsm overrides the systemd user manager's
  - name: uwsm
    default: false
    install:
      - pacman:uwsm
    config: ~/.config/uwsm

  # top bar
  - name: quickshell
    default: false
    install:
      - pacman:quickshell
      # brightness block
      - pacman:brightnessctl
    config: ~/.config/quickshell
