modules:
  - name: hyprland
    default: false
    install:
      - pacman:wayland
      - pacman:wayland-protocols
      - pacman:libinput
      - pacman:polkit
      - pacman:xdg-desktop-portal
      - pacman:xdg-desktop-portal-wlr
      - pacman:xorg-xwayland
      - pacman:hyprland
      - pacman:xdg-utils
      - pacman:wl-clipboard
      - pacman:qt6-wayland
      - pacman:qt5-wayland
      - pacman:xdg-desktop-portal-gtk
      - pacman:xdg-desktop-portal-hyprland
      - pacman:hyprpolkitagent
      # notification daemon, D-Bus activated on first notification
      - pacman:dunst
      # permission popups (ecosystem.enforce_permissions)
      - pacman:hyprland-guiutils
    config: ~/.config/hypr

  - name: hyprland-screenshot
    parent: hyprland
    install:
      # hyprshot (hyprpicker freeze, slurp region, grim capture) -> satty
      - pacman:hyprshot
      - pacman:grim
      - pacman:slurp
      - pacman:satty
      - pacman:hyprpicker

  # session env ($PATH, etc); uwsm overrides the systemd user manager's
  - name: uwsm
    parent: hyprland
    install:
      - pacman:uwsm
    config: ~/.config/uwsm

  # XDG_DOWNLOAD_DIR etc (used by firefox, chromium, file pickers)
  - name: user-dirs
    parent: hyprland
    config: ~/.config/user-dirs.dirs

  # top bar, wallpaper, lock screen
  - name: quickshell
    parent: hyprland
    install:
      - pacman:quickshell
      # wallpaper logo (arch.svg)
      - pacman:qt6-svg
      # brightness block
      - pacman:brightnessctl
    config: ~/.config/quickshell

  # qs launcher's specific dependencies
  - name: launcher
    parent: hyprland
    install:
      # calc (qalc)
      - pacman:libqalculate
      # emoji list + search keywords
      - pacman:unicode-emoji
      - pacman:unicode-cldr-annotations
    exec: |
      # for #def: downloads GCIDE (Webster's 1913) and builds its lookup files
      "$DOTFILES_DIR/scripts/dict-def" --build
