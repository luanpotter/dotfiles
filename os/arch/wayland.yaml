modules:
  - name: hyprland
    default: false
    install:
      - pacman:wayland
      - pacman:wayland-protocols
      - pacman:libinput
      - pacman:polkit
      - pacman:xdg-desktop-portal
      - pacman:xdg-desktop-portal-wlr
      - pacman:xorg-xwayland
      - pacman:hyprland
      - pacman:xdg-utils
      - pacman:wl-clipboard
      - pacman:qt6-wayland
      - pacman:qt5-wayland
      - pacman:xdg-desktop-portal-gtk
      - pacman:xdg-desktop-portal-hyprland
      # screenshot: hyprshot -> satty + hyprpicker
      - pacman:hyprshot
      - pacman:satty
      - pacman:hyprpicker
      - pacman:hyprpolkitagent
      # permission popups (ecosystem.enforce_permissions)
      - pacman:hyprland-guiutils
    config: ~/.config/hypr

  # session env ($PATH, etc); uwsm overrides the systemd user manager's
  - name: uwsm
    default: false
    install:
      - pacman:uwsm
    config: ~/.config/uwsm

  # XDG_DOWNLOAD_DIR etc (used by firefox, chromium, file pickers)
  - name: user-dirs
    default: false
    config: ~/.config/user-dirs.dirs

  # top bar, wallpaper, lock screen, and launcher
  - name: quickshell
    default: false
    install:
      - pacman:quickshell
      # wallpaper logo (arch.svg)
      - pacman:qt6-svg
      # brightness block
      - pacman:brightnessctl
      # launcher: calc (qalc), emoji list + search keywords
      - pacman:libqalculate
      - pacman:unicode-emoji
      - pacman:unicode-cldr-annotations
    config: ~/.config/quickshell
