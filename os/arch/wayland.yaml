modules:
  - name: hyprland
    default: false
    install:
      - pacman:wayland
      - pacman:wayland-protocols
      - pacman:libinput
      - pacman:polkit
      - pacman:xdg-desktop-portal
      - pacman:xdg-desktop-portal-wlr
      - pacman:xorg-xwayland
      - pacman:hyprland
      - pacman:xdg-utils
      - pacman:wl-clipboard
      - pacman:qt6-wayland
      - pacman:qt5-wayland
      - pacman:hyprpaper
      - pacman:xdg-desktop-portal-gtk
      - pacman:xdg-desktop-portal-hyprland
      # screenshot: hyprshot -> satty + hyprpicker
      - pacman:hyprshot
      - pacman:satty
      - pacman:hyprpicker
    config: ~/.config/hypr

  # session env ($PATH, etc); uwsm overrides the systemd user manager's
  - name: uwsm
    default: false
    install:
      - pacman:uwsm
    config: ~/.config/uwsm

  # experimenting to replace waybar
  - name: quickshell
    default: false
    install:
      - pacman:quickshell
    config: ~/.config/quickshell

  - name: waybar
    default: false
    install:
      - pacman:waybar
      - pacman:otf-font-awesome
      - pacman:otf-droid-nerd
    config: ~/.config/waybar

  # calendar popup on waybar clock click
  - name: gsimplecal
    default: false
    install:
      - pacman:gsimplecal
    config: ~/.config/gsimplecal
