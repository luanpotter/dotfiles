bootstrap: [git, base-devel, yq, fzf]

modules:
  - name: system
    install:
      - pacman:linux
      - pacman:linux-headers
      - pacman:linux-firmware
      - pacman:base
    # updates /boot to match the system's systemd-boot
    exec: |
      sudo systemctl enable systemd-boot-update.service

  - name: compat
    install:
      - pacman:fuse2
      - pacman:libsecret
      - pacman:gnome-keyring

  - name: reflector
    install:
      - pacman:reflector
    exec: |
      sudo reflector --verbose --latest 5 --sort rate --save /etc/pacman.d/mirrorlist

  - name: core
    install:
      - pacman:less
      - pacman:man
      - pacman:man-db
      - pacman:sudo
      - pacman:tree
      - pacman:btop
      - pacman:htop
      - pacman:wget
      - pacman:openssh
      - pacman:the_silver_searcher
      - pacman:jq

  - name: network
    install:
      - pacman:networkmanager
      - pacman:wpa_supplicant # wifi
    exec: |
      sudo systemctl enable NetworkManager

  - name: disk
    install:
      - pacman:snapper # btrfs snapshots
      - pacman:smartmontools # drive health

  - name: compression
    install:
      - pacman:zip
      - pacman:unzip
      - pacman:unrar

  # must be copied, not symlinked: the greeter runs as the sddm user,
  # which can't read into home folder for resolving the links.
  # The screen design is shared with the quickshell wallpaper, so those
  # files are copied in too, and colors.json becomes the theme.conf.
  - name: sddm
    install:
      - pacman:sddm
      # Backdrop logo (arch.svg)
      - pacman:qt6-svg
    exec: |
      theme=/usr/share/sddm/themes/dotfiles
      qs="$DOTFILES_DIR/config/quickshell"
      sudo install -Dm644 "$DOTFILES_DIR/config/sddm/sddm.conf" /etc/sddm.conf.d/dotfiles.conf
      sudo rm -rf "$theme"
      sudo cp -r "$DOTFILES_DIR/config/sddm/theme" "$theme"
      sudo cp "$qs/Backdrop.qml" "$qs/PasswordField.qml" "$qs/arch.svg" "$theme/"
      jq -r '"[General]", (to_entries[] | "\(.key)=\"\(.value)\"")' "$qs/colors.json" |
        sudo tee "$theme/theme.conf" >/dev/null
      sudo systemctl enable sddm

  - name: fonts
    install:
      # color emoji (launcher, browsers, terminals)
      - pacman:noto-fonts-emoji
    exec: |
      sudo bash -O globstar -O nullglob -c "cp $DOTFILES_DIR/fonts/**/*.{ttf,otf} /usr/share/fonts/" 2>/dev/null || true
      fc-cache
