bootstrap: [git, base-devel, yq, gum]

modules:
  - name: system
    install:
      - pacman:linux
      - pacman:linux-headers
      - pacman:linux-firmware
      - pacman:base

  - name: compat
    install:
      - pacman:fuse2
      - pacman:libsecret
      - pacman:gnome-keyring

  - name: reflector
    install:
      - pacman:reflector
    exec: |
      sudo reflector --verbose --latest 5 --sort rate --save /etc/pacman.d/mirrorlist

  - name: core
    install:
      - pacman:less
      - pacman:man
      - pacman:man-db
      - pacman:sudo
      - pacman:tree
      - pacman:btop
      - pacman:htop
      - pacman:wget
      - pacman:openssh
      - pacman:the_silver_searcher
      - pacman:jq

  # configs the graphical session env ($PATH, etc)
  - name: environment.d
    config: ~/.config/environment.d

  - name: compression
    install:
      - pacman:zip
      - pacman:unzip
      - pacman:unrar

  - name: rofi
    install:
      - pacman:rofi
      - pacman:rofi-calc
      - pacman:rofi-emoji
      # rofi-emoji copies using the wayland clipboard
      - pacman:wl-clipboard
    config: ~/.config/rofi

  - name: lightdm
    install:
      - pacman:lightdm
      - pacman:lightdm-mini-greeter
    exec: |
      sudo systemctl enable lightdm

  - name: fonts
    exec: |
      sudo bash -O globstar -O nullglob -c "cp $DOTFILES_DIR/fonts/**/*.{ttf,otf} /usr/share/fonts/" 2>/dev/null || true
      fc-cache
