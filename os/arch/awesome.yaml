modules:
  - name: xorg
    install:
      - pacman:xinit-xsession
      - pacman:xorg-server
      - pacman:xorg-server-xephyr
      - pacman:xorg-xinit
      # xorg 2D acceleration for AMD
      - pacman:xf86-video-amdgpu
      # X11 clipboard; equivalent to wl-clipboard
      - pacman:xclip

  - name: awesome
    install:
      - pacman:awesome
      - pacman:acpi
      # X11 screenshot (superceded by hyprshot in wayland)
      - pacman:flameshot
    config: ~/.config/awesome
